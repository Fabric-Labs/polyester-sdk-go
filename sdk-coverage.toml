# Intentional Connect RPC omissions for this API-key SDK.
# Every public gen procedure must be either wrapped or listed here.
# CI: python3 scripts/check_sdk_coverage.py

[[allowlist]]
service = "auth.v1.MFAService"
reason = "MFA enrollment and step-up are outside the API-key SDK surface."

[[allowlist]]
procedure = "/auth.v1.AuthService/CreateWalletChallenge"
reason = "Wallet login is intentionally outside the API-key SDK surface."

[[allowlist]]
procedure = "/auth.v1.AuthService/LoginWithWallet"
reason = "Wallet login is intentionally outside the API-key SDK surface."

[[allowlist]]
service = "auth.v1.PolicyService"
reason = "Sub-account and API-key policy reads accept API keys with READ_SUBACCOUNT_POLICIES or READ_API_POLICIES but are not wrapped in this SDK, which exposes policy updates through realtime subscribe; policy writes require an interactive session."

[[allowlist]]
service = "auth.v1.ProfileService"
reason = "GetProfile and GetUsernameHistory accept main-account API keys with READ_PROFILE but are not wrapped in this SDK, which exposes identity subscribe; profile and username writes require an interactive session."

[[allowlist]]
service = "auth.v1.ResolveService"
reason = "ResolveAccount accepts API keys with READ_ACCOUNT_DIRECTORY but is not wrapped in this SDK."

[[allowlist]]
procedure = "/auth.v1.ApiKeyService/CreateApiKey"
reason = "API key create requires JWT/session auth."

[[allowlist]]
procedure = "/auth.v1.ApiKeyService/UpdateApiKey"
reason = "API key update requires JWT/session auth."

[[allowlist]]
procedure = "/auth.v1.ApiKeyService/DeleteApiKey"
reason = "API key delete requires JWT/session auth."

[[allowlist]]
procedure = "/auth.v1.SubaccountService/CreateSubaccount"
reason = "Subaccount create requires JWT/session auth."

[[allowlist]]
procedure = "/auth.v1.SubaccountService/CreateSubaccountChallenge"
reason = "Subaccount create requires JWT/session auth."

[[allowlist]]
procedure = "/auth.v1.SubaccountService/UpdateSubaccount"
reason = "Subaccount update/delete requires JWT/session auth."

[[allowlist]]
procedure = "/auth.v1.SubaccountService/SetSubaccountMemberMFARequirement"
reason = "Subaccount MFA admin requires JWT/session auth."

[[allowlist]]
procedure = "/auth.v1.SubaccountService/RemoveSubaccountMember"
reason = "Subaccount member admin requires JWT/session auth."

[[allowlist]]
procedure = "/auth.v1.SubaccountService/UpdateSubaccountMemberRole"
reason = "Subaccount member admin requires JWT/session auth."

[[allowlist]]
procedure = "/auth.v1.SubaccountService/InviteSubaccountMember"
reason = "Subaccount invite mutations require JWT/session auth."

[[allowlist]]
procedure = "/auth.v1.SubaccountService/RespondSubaccountInvite"
reason = "Subaccount invite mutations require JWT/session auth."

[[allowlist]]
procedure = "/auth.v1.AddressBookService/CopyAddressBookEntry"
reason = "Address book copy is not wrapped in the API-key SDK."

[[allowlist]]
service = "auth.v1.SubaccountRoleService"
reason = "The role catalog is public metadata and GetEffectiveSubaccountPermissions accepts API keys with READ_SUBACCOUNT_PERMISSIONS; neither is wrapped in this SDK."

[[allowlist]]
procedure = "/ledger.read.v1.LedgerReadService/GetPortfolioEquityHistorySeries"
reason = "Root portfolio equity history requires an interactive root-account session; API keys and subaccount-scoped sessions are not supported."

[[allowlist]]
procedure = "/ledger.read.v1.LedgerReadService/GetPortfolioEquitySnapshot"
reason = "Root portfolio equity snapshot requires an interactive root-account session; API keys and subaccount-scoped sessions are not supported."

[[allowlist]]
procedure = "/auth.v1.AuthService/AcceptTerms"
reason = "Terms acceptance requires an interactive JWT session; API keys are not supported."

[[allowlist]]
service = "claims.v1.ClaimsService"
reason = "GetDailyClaimStatus and ClaimDailyReward accept main-account API keys with READ_DAILY_CLAIMS or CLAIM_DAILY_REWARD but are not wrapped in this SDK."

[[allowlist]]
service = "rewards.v1.RewardCampaignService"
reason = "ListMyRewardAwards accepts main-account API keys with READ_REWARDS but is not wrapped in this SDK; AcknowledgeMyRewardAward and SetMyRewardDestination require an interactive root-account session."

[[allowlist]]
service = "swap.quickswap.v1.QuickSwapService"
reason = "Quick Swap authenticates with a broker API key, which is outside the API-key SDK surface."

[[allowlist]]
service = "swap.quickswap.v1.QuickSwapBrokerService"
reason = "Quick Swap broker management authenticates with a broker API key or an interactive session; outside the API-key SDK surface."

[[allowlist]]
procedure = "/chain.withdraw.v1.AutoWithdrawService/SetAutoWithdrawRule"
reason = "Auto-withdraw rule changes require an interactive session with a fresh MFA step-up; API keys are not accepted."

[[allowlist]]
procedure = "/chain.withdraw.v1.AutoWithdrawService/GetAutoWithdrawRule"
reason = "Auto-withdraw rule reads are not wrapped in the API-key SDK."

[[allowlist]]
procedure = "/chain.withdraw.v1.AutoWithdrawService/ListAutoWithdrawRuns"
reason = "Auto-withdraw run reads are not wrapped in the API-key SDK."

[[allowlist]]
service = "swap.v1.SwapService"
reason = "Swap quote, create and get are not wrapped in the API-key SDK."

[[allowlist]]
procedure = "/checkpoints.v1.CheckpointService/ListMyCheckpoints"
reason = "ListMyCheckpoints accepts main-account API keys with READ_CHECKPOINTS but is not wrapped in this SDK."

[[allowlist]]
procedure = "/transfer.v1.InternalTransferService/GetInternalTransfer"
reason = "Internal transfer lookup by transfer or request ID requires an interactive session; the contract does not accept API keys. InternalTransfers.Create returns the flow ID."

[[allowlist]]
procedure = "/chain.withdraw.v1.AutoWithdrawService/SetAutoWithdrawRuleEnabled"
reason = "Pausing and resuming an auto-withdraw rule requires an interactive session (resuming also a fresh MFA step-up); API keys are not accepted."

[[allowlist]]
procedure = "/chain.withdraw.v1.AutoWithdrawService/PreviewAutoWithdrawRun"
reason = "The auto-withdraw run preview accepts API keys with READ_AUTO_WITHDRAW but is not wrapped in this SDK, like the other auto-withdraw reads."

[[allowlist]]
service = "ai.v1.AssistantService"
reason = "The Polyester assistant accepts only interactive session tokens; API keys are not accepted. Devnet only."


[[allowlist]]
procedure = "/auth.v1.ApiKeyService/SetAssistantKeys"
reason = "Assistant key setup requires an interactive session with a fresh MFA step-up; API keys are not accepted. Devnet only."

[[allowlist]]
procedure = "/auth.v1.ApiKeyService/ListAssistantKeys"
reason = "Assistant key listing requires an interactive session; API keys are not accepted. Devnet only."

[[allowlist]]
procedure = "/auth.v1.ApiKeyService/DeleteAssistantKeys"
reason = "Assistant key revocation requires an interactive session; API keys are not accepted. Devnet only."

[[allowlist]]
procedure = "/auth.v1.SocialVerificationService/ConfirmSocialVerification"
reason = "Confirming a Telegram link requires an interactive session with a fresh MFA step-up; API keys are not accepted."

[[allowlist]]
procedure = "/auth.v1.SocialVerificationService/UnlinkSocialAccount"
reason = "Unlinking a social account requires an interactive session; API keys are not accepted."

[[allowlist]]
service = "swap.quickswap.v1.QuickSwapReferralService"
reason = "Quick Swap referrals authenticate with an interactive session; Quick Swap is outside the API-key SDK surface."

[[allowlist]]
service = "notifications.v1.NotificationService"
reason = "The notification center is not part of the trading SDK surface yet."
