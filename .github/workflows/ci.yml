name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  go:
    name: Go checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Reject private ledger.write gen
        run: |
          if [ -d gen/ledger/write ] || grep -Rql 'ledger\.write\.v1' gen; then
            echo "private ledger.write.v1 must not appear in public SDK gen/" >&2
            exit 1
          fi

      - name: SDK Connect coverage
        run: python3 scripts/check_sdk_coverage.py

      - name: Refresh internal coverage scoreboard
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.FABRIC_CONTEXT_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "FABRIC_CONTEXT_DISPATCH_TOKEN unset; skipping scoreboard dispatch"
            exit 0
          fi
          gh api repos/Fabric-Labs/fabric-context/dispatches \
            -f event_type=sdk-coverage-refresh \
            -f 'client_payload[sdk]=go' \
            -f 'client_payload[sha]=${{ github.sha }}'

      - name: Test
        run: go test ./...

      - name: golangci-lint
        # verify:false skips remote JSON Schema fetch from golangci-lint.run
        # (flaky timeouts). Invalid config still fails at `golangci-lint run`.
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.6.2
          verify: false
          args: --timeout=5m
