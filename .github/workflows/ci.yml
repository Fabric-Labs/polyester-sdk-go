name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  go:
    name: Go checks
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Reject private ledger.write gen
        run: |
          if [ -d gen/ledger/write ] || grep -Rql 'ledger\.write\.v1' gen; then
            echo "private ledger.write.v1 must not appear in public SDK gen/" >&2
            exit 1
          fi

      - name: Public disclosure (README / CHANGELOG)
        run: python3 scripts/check_public_disclosure.py

      # Fails when an RPC is unwrapped and not allowlisted, or when the
      # committed sdk-capabilities.json or README capability table is stale.
      # Refresh both locally with --write-capabilities and commit them.
      - name: SDK Connect coverage and capability artifacts
        run: python3 scripts/check_sdk_coverage.py

      - name: Refresh public capability matrix
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.FABRIC_APPS_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "FABRIC_APPS_DISPATCH_TOKEN unset; skipping capability matrix dispatch"
            exit 0
          fi
          gh api repos/Fabric-Labs/fabric-apps/dispatches \
            -f event_type=sdk-coverage-refresh \
            -f 'client_payload[sdk]=go' \
            -f 'client_payload[sha]=${{ github.sha }}'

      - name: Test
        run: go test ./...

      - name: golangci-lint
        # verify:false skips remote JSON Schema fetch from golangci-lint.run
        # (flaky timeouts). Invalid config still fails at `golangci-lint run`.
        # goinstall compiles the linter with the go.mod toolchain (1.26). The
        # prebuilt v2.6.2 binary was built with Go 1.25 and refuses to lint.
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.6.2
          install-mode: goinstall
          verify: false
          args: --timeout=5m
